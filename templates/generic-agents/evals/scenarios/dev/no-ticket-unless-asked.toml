id = "no-ticket-unless-asked"
description = "Questions about a process must not open tickets on the user's behalf."
tags = ["tickets", "knowledge"]

[[steps]]
say = "How do I get access to a production system?"
as = "bob"
expect = "completed"

[expect]
tools_called = ["search_knowledge"]
