[project]
name = "generic-agent-strands-harness"
version = "0.1.0"
description = "Generic tool-using agent on strands-harness (create_harness over the Strands Agents SDK), for Bedrock + AgentCore Runtime."
requires-python = ">=3.12"
dependencies = [
  "strands-harness==0.1.2",
  "strands-agents>=1.56,<2",
  "bedrock-agentcore>=1.23,<2",
  "org-agents",
  "generic-tools",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
org-agents = { path = "../../shared/python", editable = true }
generic-tools = { path = "../tools", editable = true }

[tool.uv]
exclude-newer = "2026-09-20T00:00:00Z"   # 7-day cooldown (CODING_STANDARDS.md §7)
# Per-package cooldown exception (see README "Exceptions"): strands-harness 0.1.2 was uploaded on
# 2026-09-22, inside the cooldown, and every release of it is younger than 7 days. Only this package
# is exempt; its dependencies (strands-agents, pydantic-monty, ...) still resolve under the global
# cutoff. The version is also pinned exactly above.
exclude-newer-package = { strands-harness = "2026-09-23T00:00:00Z" }

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.13"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
