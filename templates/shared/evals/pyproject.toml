[project]
name = "org-evals"
version = "0.1.0"
description = "Scenario evals for org agents over the AgentCore /invocations contract, plus the autoresearch loop."
requires-python = ">=3.12"
dependencies = ["org-agents"]   # the runner itself is standard-library only

[project.optional-dependencies]
bedrock = ["boto3>=1.40"]       # only for the LLM judge (Bedrock Converse)

[project.scripts]
org-evals = "org_evals.shell.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
org-agents = { path = "../python", editable = true }

[tool.uv]
exclude-newer = "2026-09-20T00:00:00Z"   # 7-day cooldown (see CODING_STANDARDS.md §7)

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "ruff>=0.13"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
