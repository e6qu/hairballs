[project]
name = "org-pydantic-harness"
version = "0.1.0"
description = "Thin org harness on Pydantic AI: guarded runner (limits, budget, loop detection, four-eyes approval), session persistence, context management, prompt caching, steering."
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[bedrock]>=2.46,<3",   # capabilities API, AgentRun.enqueue
  "org-agents",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
org-agents = { path = "../python", editable = true }

[tool.uv]
exclude-newer = "2026-09-20T00:00:00Z"   # 7-day cooldown (CODING_STANDARDS.md §7)

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "ruff>=0.13"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
